[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verizon-gateway-skill"
version = "0.1.0"
description = "Read-only LVSKIHP gateway telemetry and monitoring"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "playwright>=1.48,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2", "hatchling>=1.26,<2"]

[project.scripts]
verizon-gateway = "verizon_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verizon_gateway"]
include = ["src/verizon_gateway/*.py", "src/verizon_gateway/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["src/verizon_gateway/*.py", "src/verizon_gateway/py.typed", "tests/*.py", "skills/verizon-gateway/SKILL.md", "docs/*.md", "README.md", "AGENTS.md", "LICENSE", "pyproject.toml", ".env.example", ".gitignore", ".github/workflows/ci.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in live hardware checks"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
